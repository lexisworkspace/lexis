# Deploys Lexis to Vercel (production) automatically.
#
# Every push to the default branch (master) ships to production, and the
# workflow can be re-run manually from the Actions tab (workflow_dispatch).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN       - create one at https://vercel.com/account/tokens
#   VERCEL_ORG_ID      - the "orgId" value in .vercel/project.json
#   VERCEL_PROJECT_ID  - the "projectId" value in .vercel/project.json
#
# Note: .vercel/ is gitignored, so the CI checkout has no local project
# link - the org/project ids MUST come from secrets, and the app's own env
# vars (e.g. NVIDIA_API_KEY) must be configured in the Vercel dashboard.

name: Deploy to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
