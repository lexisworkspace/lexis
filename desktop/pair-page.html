<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>Orleia · Your workspace</title>
<style>
  :root { color-scheme: dark; --bg: #0a0a0a; --card: rgba(255,255,255,.04); --border: rgba(255,255,255,.09); --txt: #fafafa; --mut: rgba(250,250,250,.5); --dim: rgba(250,250,250,.32); --acc: #6366f1; --ok: #34d399; --err: #f87171; --serif: Georgia, "Times New Roman", serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  }
  .app { display: flex; flex-direction: column; min-height: 100dvh; max-width: 520px; margin: 0 auto; }
  header { padding: calc(env(safe-area-inset-top) + 22px) 20px 8px; text-align: center; }
  .mark { font-size: 10px; letter-spacing: .5em; color: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .mark b { color: var(--acc); font-weight: 400; }
  h1 { font-family: var(--serif); font-weight: 300; font-size: 28px; letter-spacing: -.01em; margin-top: 12px; }
  .status { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--mut); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; flex-shrink: 0; }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }

  main { flex: 1; padding: 14px 16px calc(env(safe-area-inset-bottom) + 96px); }
  .panel { display: none; }
  .panel.active { display: block; animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .compose { display: flex; gap: 8px; margin-bottom: 14px; }
  input[type="text"], textarea {
    flex: 1; background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 12px;
    color: var(--txt); font-size: 14px; padding: 12px 14px; outline: none; font-family: inherit;
  }
  input[type="text"]:focus, textarea:focus { border-color: rgba(99,102,241,.6); }
  textarea { min-height: 88px; resize: vertical; }
  .icon-btn {
    flex-shrink: 0; width: 44px; border-radius: 12px; border: 1px solid var(--border);
    background: rgba(255,255,255,.05); color: var(--mut); font-size: 20px; cursor: pointer;
  }
  .icon-btn:active { transform: scale(.95); }

  .card {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    border: 1px solid var(--border); background: var(--card); border-radius: 14px;
    padding: 13px 14px; margin-bottom: 8px; color: var(--txt); cursor: pointer;
    font-family: inherit; font-size: 14px; transition: background .15s;
  }
  .card:active { background: rgba(255,255,255,.08); }
  .check {
    width: 24px; height: 24px; border-radius: 8px; border: 1.5px solid rgba(250,250,250,.25);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: transparent;
  }
  .card.done .check, .card.on .check { background: var(--acc); border-color: var(--acc); color: #fff; }
  .card.done .lbl { color: var(--dim); text-decoration: line-through; }
  .body { flex: 1; min-width: 0; }
  .lbl { font-size: 14px; }
  .meta { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .pill { flex-shrink: 0; font-size: 10px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--border); color: var(--mut); white-space: nowrap; }
  .pill.on { border-color: rgba(99,102,241,.5); color: #a5b4fc; background: rgba(99,102,241,.12); }
  .del {
    flex-shrink: 0; width: 32px; height: 32px; border-radius: 9px; border: 0; background: transparent;
    color: var(--dim); font-size: 15px; cursor: pointer;
  }
  .del:active { color: var(--err); }
  .empty { color: var(--dim); font-size: 13px; padding: 10px 2px; }

  .add-form { border: 1px solid var(--border); background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
  .add-form .row { display: flex; gap: 8px; }
  .add-form .row input { border: 0; background: transparent; padding: 8px 2px; }
  .add-form .row input:focus { border: 0; }
  .add-form .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .mini-btn { border-radius: 999px; border: 0; padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .mini-btn.primary { background: var(--acc); color: #fff; }
  .mini-btn.ghost { background: transparent; color: var(--mut); border: 1px solid var(--border); font-weight: 500; }

  .section-h { font-family: var(--serif); font-weight: 300; font-size: 15px; color: var(--mut); margin: 18px 0 10px; letter-spacing: .02em; }
  .j-entry { display: block; width: 100%; text-align: left; }
  .j-entry .pre { color: var(--mut); font-size: 13px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .j-entry.open .pre { -webkit-line-clamp: unset; display: block; white-space: pre-wrap; }

  .err-box { margin: 14px 0; border-radius: 14px; border: 1px solid rgba(248,113,113,.3); background: rgba(248,113,113,.07); padding: 14px; font-size: 13px; color: #fca5a5; line-height: 1.6; display: none; }

  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: flex; background: rgba(10,10,10,.92); backdrop-filter: blur(18px);
    border-top: 1px solid var(--border); padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px);
    max-width: 520px; margin: 0 auto;
  }
  .tab {
    flex: 1; border: 0; background: transparent; color: var(--dim); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 9.5px; letter-spacing: .04em; padding: 6px 0; font-family: inherit;
  }
  .tab .ic { font-size: 19px; line-height: 1; }
  .tab.active { color: var(--acc); }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translateX(-50%);
    background: #fff; color: #0a0a0a; font-size: 12px; font-weight: 600; border-radius: 999px;
    padding: 9px 18px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 30;
  }
  .toast.show { opacity: 1; }
  .foot { text-align: center; font-size: 10px; color: var(--dim); line-height: 1.7; margin-top: 22px; padding: 0 10px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="mark">ORLEIA<b>OS</b></p>
    <h1 id="title">Your workspace</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting to your desktop…</span></div>
  </header>

  <div class="err-box" id="err"></div>

  <main id="content">
    <section class="panel active" id="panel-habits">
      <div id="habit-compose" class="compose" style="display:none">
        <input type="text" id="habit-name" maxlength="60" placeholder="Habit name…" />
        <button class="icon-btn" id="habit-add" title="Add">＋</button>
      </div>
      <div id="habits"></div>
    </section>

    <section class="panel" id="panel-tasks">
      <div class="compose">
        <input type="text" id="task-title" maxlength="120" placeholder="New task…" />
        <button class="icon-btn" id="task-add" title="Add">＋</button>
      </div>
      <div id="tasks"></div>
      <p class="section-h" id="done-h" style="display:none">Completed</p>
      <div id="tasks-done"></div>
    </section>

    <section class="panel" id="panel-journal">
      <p class="section-h" id="j-today-h">Today</p>
      <div class="add-form">
        <textarea id="journal-text" placeholder="Write today's entry…"></textarea>
        <div class="acts"><button class="mini-btn primary" id="journal-save">Save entry</button></div>
      </div>
      <p class="section-h" id="j-past-h">Previous</p>
      <div id="journal"></div>
    </section>

    <section class="panel" id="panel-docs">
      <div id="notes"></div>
    </section>
  </main>

  <nav class="tabs">
    <button class="tab active" data-tab="habits"><span class="ic">◉</span><span data-i18n="habits">Habits</span></button>
    <button class="tab" data-tab="tasks"><span class="ic">☑</span><span data-i18n="tasks">Tasks</span></button>
    <button class="tab" data-tab="journal"><span class="ic">✎</span><span data-i18n="journal">Journal</span></button>
    <button class="tab" data-tab="docs"><span class="ic">▤</span><span data-i18n="docs">Docs</span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>

  };

  var lang = "en";
  var T = L.en;
  function setLang(code) { lang = L[code] ? code : "en"; T = L[lang]; document.documentElement.lang = lang; document.documentElement.dir = (lang === "ar") ? "rtl" : "ltr"; }
  function tr(key) { return T[key] || key; }
  function trN(key, n) { return tr(key).split("{n}").join(String(n)); }

  var footEl = null;
  function applyI18n() {
    $("title").textContent = tr("title");
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = tr(el.getAttribute("data-i18n")); });
    $("habit-name").placeholder = tr("habitName");
    $("task-title").placeholder = tr("taskPh");
    $("journal-text").placeholder = tr("jPh");
    $("j-today-h").textContent = tr("jToday");
    $("j-past-h").textContent = tr("jPast");
    $("done-h").textContent = tr("done");
    $("journal-save").textContent = tr("save");
    if (footEl) footEl.textContent = tr("foot");
  }

  /* ---------------- helpers ---------------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function setStatus(kind, msg) {
    $("dot").className = "dot" + (kind === "ok" ? " ok" : kind === "err" ? " err" : "");
    $("status").textContent = msg;
  }
  function showToast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { t.classList.remove("show"); }, 1600);
  }
  function streakFor(logs) {
    var streak = 0, day = new Date();
    while (true) {
      var iso = day.getFullYear() + "-" + String(day.getMonth() + 1).padStart(2, "0") + "-" + String(day.getDate()).padStart(2, "0");
      if (!logs.some(function (l) { return String(l.date || l.timestamp || "").indexOf(iso) === 0; })) break;
      streak++;
      day.setDate(day.getDate() - 1);
    }
    return streak;
  }
  function dateLabel(iso) {
    if (!iso) return "";
    var d = new Date(iso.slice(0, 10) + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(lang === "en" ? "en-US" : lang, { month: "short", day: "numeric" });
  }

  /* ---------------- API ---------------- */
  function apiGet() {
    return fetch("/api/data?token=" + encodeURIComponent(token), { cache: "no-store" }).then(function (r) {
      if (r.status === 401) { var e = new Error("expired"); e.expired = true; throw e; }
      if (!r.ok) throw new Error("bad status " + r.status);
      return r.json();
    });
  }
  function apiAction(action) {
    return fetch("/api/action?token=" + encodeURIComponent(token), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(action),
      cache: "no-store",
    }).then(function (r) {
      if (r.status === 401) { var e = new Error("expired"); e.expired = true; throw e; }
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "action failed"); return j; });
    });
  }

  /* ---------------- rendering ---------------- */
  function render() {
    var data = state.data;
    if (!data) return;
    if (data.theme && data.theme.language) setLang(data.theme.language);
    applyI18n();

    var habits = (data.habits || []).filter(function (h) { return !h.archived; });
    var logs = data.habitLogs || [];
    var today = todayISO();
    var tasks = data.tasks || [];
    var pending = tasks.filter(function (t) { return t.status !== "done" && t.status !== "archived"; });
    var doneList = tasks.filter(function (t) { return t.status === "done"; });
    var journal = (data.journalEntries || []).slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    var notes = data.notes || [];

    /* habits */
    var h = "";
    if (habits.length === 0) h = '<div class="empty">' + esc(tr("noHabits")) + '</div>';
    habits.forEach(function (x) {
      var l = logs.filter(function (lg) { return lg.habitId === x.id; });
      var on = l.some(function (lg) { return String(lg.date || lg.timestamp || "").indexOf(today) === 0; });
      var streak = streakFor(l);
      h += '<div class="card' + (on ? " on" : "") + '" data-act="habit" data-id="' + esc(x.id) + '">' +
        '<span class="check">✓</span>' +
        '<span class="body"><span class="lbl">' + esc(x.name) + '</span>' +
        (x.description ? '<div class="meta">' + esc(x.description) + '</div>' : "") + '</span>' +
        '<span class="pill' + (on ? " on" : "") + '">' + esc(on ? tr("today") : trN("streak", streak)) + '</span>' +
        '</div>';
    });
    $("habits").innerHTML = h;

    /* tasks */
    var p = "";
    if (pending.length === 0) p = '<div class="empty">' + esc(tr("noTasks")) + '</div>';
    pending.forEach(function (t) {
      p += '<div class="card" data-act="task" data-id="' + esc(t.id) + '">' +
        '<span class="check">✓</span>' +
        '<span class="body"><span class="lbl">' + esc(t.title) + '</span>' +
        (t.dueDate ? '<div class="meta">' + esc(dateLabel(t.dueDate)) + '</div>' : "") + '</span>' +
        '<button class="del" data-act="del" data-id="' + esc(t.id) + '" aria-label="' + esc(tr("del")) + '">✕</button>' +
        '</div>';
    });
    $("tasks").innerHTML = p;

    var d = "";
    if (doneList.length === 0) { $("done-h").style.display = "none"; }
    else {
      $("done-h").style.display = "block";
      doneList.slice(0, 10).forEach(function (t) {
        d += '<div class="card done" data-act="task" data-id="' + esc(t.id) + '">' +
          '<span class="check">✓</span><span class="body"><span class="lbl">' + esc(t.title) + '</span></span></div>';
      });
    }
    $("tasks-done").innerHTML = d;

    /* journal */
    var j = "";
    if (journal.length === 0) j = '<div class="empty">' + esc(tr("noJournal")) + '</div>';
    journal.slice(0, 20).forEach(function (e) {
      var preview = (e.content || "").replace(/\n+/g, " ").slice(0, 120);
      j += '<div class="card j-entry" data-act="journal">' +
        '<span class="body"><span class="meta">' + esc(dateLabel(e.date)) + '</span>' +
        '<div class="pre">' + esc(preview) + '</div></span></div>';
    });
    $("journal").innerHTML = j;

    /* docs */
    var n = "";
    if (notes.length === 0) n = '<div class="empty">' + esc(tr("noDocs")) + '</div>';
    notes.slice(0, 30).forEach(function (note) {
      n += '<div class="card" style="cursor:default">' +
        '<span class="body"><span class="lbl">' + esc(note.title || "Untitled") + '</span>' +
        (note.updatedAt ? '<div class="meta">' + esc(String(note.updatedAt).slice(0, 10)) + '</div>' : "") + '</span></div>';
    });
    $("notes").innerHTML = n;
  }

  /* ---------------- sync ---------------- */
  var firstLoad = true;
  function load(manual) {
    if (!token) { showFatal(tr("errExpired")); return; }
    apiGet()
      .then(function (data) {
        if (data && data.error) throw new Error(data.error);
        state.data = data;
        state.offline = false;
        $("err").style.display = "none";
        setStatus("ok", tr("live"));
        render();
        if (!manual && firstLoad) { firstLoad = false; }
      })
      .catch(function (e) {
        if (e.expired) { showFatal(tr("errExpired")); return; }
        state.offline = true;
        if (firstLoad) {
          $("err").style.display = "block";
          $("err").textContent = tr("errReach");
        } else {
          setStatus("err", tr("offline"));
        }
      });
  }

  function showFatal(msg) {
    $("err").style.display = "block";
    $("err").textContent = msg;
    setStatus("err", tr("connecting"));
  }

  function sendAction(action, done) {
    setStatus("", tr("syncing"));
    apiAction(action)
      .then(function () {
        if (done) done(true);
        load();
      })
      .catch(function (e) {
        if (e.expired) { showFatal(tr("errExpired")); return; }
        if (done) done(false);
        showToast(tr("errNetwork"));
        load();
      });
  }

  /* ---------------- events ---------------- */
  function bind(el, fn) { el.addEventListener("click", fn); }
  bind($("task-add"), function () {
    var v = $("task-title").value.trim();
    if (!v) return;
    $("task-title").value = "";
    sendAction({ type: "task.add", title: v });
  });
  $("task-title").addEventListener("keydown", function (e) { if (e.key === "Enter") $("task-add").click(); });

  var habitFormShown = false;
  bind($("habit-add"), function () {
    var name = $("habit-name").value.trim();
    if (!name) return;
    $("habit-name").value = "";
    $("habit-compose").style.display = "none";
    habitFormShown = false;
    sendAction({ type: "habit.add", name: name }, function (ok) {
      if (!ok) $("habit-compose").style.display = "flex";
    });
  });

  bind($("journal-save"), function () {
    var v = $("journal-text").value.trim();
    if (!v) return;
    $("journal-text").value = "";
    sendAction({ type: "journal.add", date: todayISO(), content: v }, function (ok) {
      if (ok) showToast(tr("saved"));
    });
  });

  document.addEventListener("click", function (e) {
    var t = e.target;
    var card = t.closest ? t.closest("[data-act]") : null;
    if (!card) return;

    var act = card.getAttribute("data-act");
    var id = card.getAttribute("data-id");

    if (act === "habit") {
      sendAction({ type: "habit.toggle", habitId: id, date: todayISO() });
    } else if (act === "task") {
      sendAction({ type: "task.toggle", taskId: id });
    } else if (act === "del") {
      e.stopPropagation();
      sendAction({ type: "task.delete", taskId: id });
    } else if (act === "journal") {
      card.classList.toggle("open");
    }
  });

  /* tabs */
  var tabs = document.querySelectorAll(".tab");
  tabs.forEach(function (tab) {
    bind(tab, function () {
      tabs.forEach(function (x) { x.classList.remove("active"); });
      tab.classList.add("active");
      state.tab = tab.getAttribute("data-tab");
      document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("active"); });
      $("panel-" + state.tab).classList.add("active");
    });
  });

  /* + button in the habits panel: toggles the add-habit form */
  var headerHabits = document.querySelector("#panel-habits");
  var plus = document.createElement("button");
  plus.className = "icon-btn";
  plus.style.cssText = "position:absolute;top:0;right:0";
  plus.textContent = "＋";
  plus.title = tr("add");
  headerHabits.style.position = "relative";
  headerHabits.appendChild(plus);
  bind(plus, function () {
    habitFormShown = !habitFormShown;
    $("habit-compose").style.display = habitFormShown ? "flex" : "none";
    if (habitFormShown) $("habit-name").focus();
  });

  /* polling while visible */
  var POLL_MS = 4000;
  setInterval(function () {
    if (document.visibilityState === "visible") load();
  }, POLL_MS);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") load();
  });

  /* footer */
  footEl = document.createElement("p");
  footEl.className = "foot";
  document.querySelector("main").appendChild(footEl);

  applyI18n();
  load();
})();
</script>
</body>
